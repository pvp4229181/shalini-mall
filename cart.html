<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Cart — Shalini Mall</title><meta name="description" content="Review artworks in your Shalini Mall shopping cart."><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css"><script defer src="js/products.js"></script><script defer src="js/cart.js"></script><script defer src="js/main.js"></script><script defer src="js/animations.js"></script></head><body class="inner-page"><main id="main" class="shop-page"><p class="eyebrow">Your selection</p><h1>Cart</h1><div class="contact-grid"><div class="contact-card"><div id="pageCart"></div></div><div class="contact-card"><h3>Order summary</h3><p>Final shipping is calculated after your address is entered.</p><button class="button dark full" id="checkout">Secure checkout</button><p id="checkoutMsg" aria-live="polite"></p></div></div></main><script>document.addEventListener('DOMContentLoaded',()=>{function draw(){const cart=readCart();pageCart.innerHTML=cart.length?cart.map(row=>{const p=ART_PRODUCTS.find(x=>x.id===row.id);return `<div class="cart-item"><span class="cart-thumb" style="--crop:${p.crop}"><img src="assets/images/collection-hero.png" alt="${p.title}"></span><div><h3>${p.title}</h3><p>${row.qty} × ${money(p.price)}</p><button class="text-link" onclick="removeFromCart('${p.id}');setTimeout(draw,0)">Remove</button></div></div>`}).join(''):'<p>Your cart is empty. <a class="text-link" href="shop.html">Explore artwork</a></p>'}draw();checkout.onclick=()=>checkoutMsg.textContent='Demo checkout is ready for payment-provider integration.'})</script></body></html>
