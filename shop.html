<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Art — Shalini Mall</title><meta name="description" content="Shop original paintings and signed fine art prints by Shalini Mall."><link rel="canonical" href="shop.html"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/animations.css"><link rel="stylesheet" href="css/responsive.css"><script defer src="js/products.js"></script><script defer src="js/cart.js"></script><script defer src="js/main.js"></script><script defer src="js/animations.js"></script></head><body class="inner-page"><main id="main" class="shop-page"><div class="shop-head"><div><p class="eyebrow">The collection</p><h1>Shop art</h1><p>Original works and archival editions for thoughtful spaces.</p></div><div class="filters" aria-label="Filter and sort artworks"><button class="filter active" data-filter="All">All</button><button class="filter" data-filter="Original">Originals</button><button class="filter" data-filter="Print">Prints</button><select class="sort" aria-label="Sort artworks"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div></div><div class="product-grid" id="shopGrid" aria-live="polite"></div></main><script>document.addEventListener('DOMContentLoaded',()=>{let cat='All';const grid=document.querySelector('#shopGrid'),sort=document.querySelector('.sort');function draw(){let list=ART_PRODUCTS.filter(p=>cat==='All'||p.category===cat);if(sort.value==='low')list.sort((a,b)=>a.price-b.price);if(sort.value==='high')list.sort((a,b)=>b.price-a.price);grid.innerHTML=list.map(productCard).join('')}document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelector('.filter.active').classList.remove('active');b.classList.add('active');cat=b.dataset.filter;draw()});sort.onchange=draw;draw()})</script></body></html>
