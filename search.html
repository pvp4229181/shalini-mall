<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Search — Shalini Mall</title>
  <meta name="description" content="Search original paintings and fine art prints by Shalini Mall.">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://shalini-mall.vercel.app/search.html">
  <meta name="theme-color" content="#f7ecec">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%238e3857'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' text-anchor='middle' fill='%23fff'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;1,400&family=Tenor+Sans&family=WindSong:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/header.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/shop.css">
  <link rel="stylesheet" href="css/footer.css">
  <link rel="stylesheet" href="css/animations.css">
  <script>document.documentElement.classList.add('js')</script>
  <script defer src="js/core.js"></script>
  <script defer src="js/products.js"></script>
  <script defer src="js/cart.js"></script>
  <script defer src="js/wishlist.js"></script>
  <script defer src="js/recently-viewed.js"></script>
  <script defer src="js/cards.js"></script>
  <script defer src="js/variants.js"></script>
  <script defer src="js/layout.js"></script>
  <script defer src="js/app.js"></script>
  <script defer src="js/search.js"></script>
  <script defer src="js/quick-view.js"></script>
  <script defer src="js/animations.js"></script>
</head>
<body>
<main id="main" class="page">
  <header class="shop-head">
    <nav class="breadcrumb" aria-label="Breadcrumb"><ol><li><a href="index.html">Home</a></li><li aria-current="page">Search</li></ol></nav>
    <h1 id="searchPageHeading">Search</h1>
    <form class="search-page-form" role="search" action="search.html">
      <label class="sr-only" for="searchPageInput">Search artworks</label>
      <input class="input" id="searchPageInput" name="q" type="search" placeholder="Title, collection, size…" autocomplete="off">
      <button class="button dark" type="submit">Search</button>
    </form>
    <p id="searchPageCount" aria-live="polite"></p>
  </header>
  <h2 class="sr-only">Matching artworks</h2>
  <div class="product-grid" id="searchPageResults"></div>
  <div class="empty-state" id="searchPageEmpty" hidden>
    <h2>No artwork found</h2>
    <p>Try a title, a collection name, or simply “original” or “print”.</p>
    <a class="text-link" href="shop.html">Explore all works</a>
  </div>
</main>
</body>
</html>
