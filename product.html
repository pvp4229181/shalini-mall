<body>
<main id="main">
  <div class="page product-page">
    <div class="product" id="product"></div>
    <div class="product-more" id="productMore"></div>
  </div>

  <section class="section section--surface" id="interiorSection" aria-labelledby="interiorTitle">
    <div class="section-head" data-reveal>
      <p class="eyebrow">Art in interiors</p>
      <h2 id="interiorTitle">In a room</h2>
      <p>Drawn to true scale, hung at the usual 145 cm centre height, so you can judge its presence before it arrives.</p>
    </div>
    <div class="interior-scenes" id="interiorScenes" data-reveal-stagger tabindex="0" role="region" aria-label="Scale drawings in three rooms"></div>
  </section>

  <section class="section" id="relatedSection" aria-labelledby="relatedTitle">
    <div class="section-head section-head--split" data-reveal>
      <div><p class="eyebrow">From the same studio</p><h2 id="relatedTitle">Related works</h2></div>
      <a class="text-link" id="relatedLink" href="shop.html">View all</a>
    </div>
    <div class="product-grid" id="relatedGrid"></div>
  </section>

  <section class="section section--flush-top" id="recentSection" aria-labelledby="recentTitle" hidden>
    <div class="section-head section-head--split"><div><p class="eyebrow">Your trail</p><h2 id="recentTitle">Recently viewed</h2></div></div>
    <div class="product-grid product-grid--4" id="recentGrid"></div>
  </section>

  <div class="sticky-buy" id="stickyBuy" aria-label="Quick purchase"></div>
</main>
<dialog class="dialog lightbox" id="lightbox" aria-label="Artwork full screen">
  <button type="button" class="icon-btn dialog-close" data-dialog-close aria-label="Close full screen view"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 5 14 14M19 5 5 19"/></svg></button>
  <div data-lightbox-art></div>
</dialog>
